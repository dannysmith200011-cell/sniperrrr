name: TikTok Bulk Harvester

on:
  workflow_dispatch: # ده اللي بيعملك الزرار اليدوي في صفحة Actions

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bulk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Harvester Script
        run: python bulk_sniper.py

      - name: Save Bulk Archive
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bulk_archive.txt
          git commit -m "Update bulk archive" || echo "No changes to commit"
          git pull origin main --rebase 
          git push
